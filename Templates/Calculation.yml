## A Calculation

version: "v0.1"

calculation:
  name: "" # (Required) A name for the calculation. 
  statement: |  # (Required) The statement of the calculation. 
    statement of the theorem
  isComplete: false # (Required) Whether the calculation has being done or not.
  calculationSteps : | # The steps of the calculation 
    steps of the calculation
  area: "" # (Required) The area of physics it belongs to. E.g. "ClassicalMechanics/HarmonicOscillator"

formalization:
  isInPhyslib : false # (Required) Whether the calculation is in PhysLib or not.

source: 
  references: [] # A list of references for the calculation. 
  addedBy: "" # The name of the person who added the calculation.
  dateAdded: "" # The date the calculation was added. "year-month-day" e.g. "2026-06-11"
  datesModified: [] # A pair of a date and an author for each time this file was modified.