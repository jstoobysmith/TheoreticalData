## A definition

version: "v0.1"

definition:
  name: "The Higgs field" # (Required) The canonical name for the definition. 
  description: | # (Required) The definition itself. 
    The Higgs Field is a scalar field responsable giving mass to the W and Z bosons, 
    as well as to the fermions through the Yukawa coupling. It sits in the 
    representation of `SU(3)xSU(2)xU(1)` as `(1,2,1/2)`, and can be formally defined 
    as living in the space of sections of a vector bundle over spacetime, with fiber `C^2`. 
  area: "Particles/StandardModel" # (Required) The area of physics it belongs to. E.g. "ClassicalMechanics/HarmonicOscillator"
  
